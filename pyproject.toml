[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual_transformer"
version = "0.1.0"
description = "High-performance PyTorch multilingual transformer trained from scratch for Indic languages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "tokenizers",
    "datasets",
    "nltk",
    "numpy",
    "tqdm",
    "ipywidgets",
    "tomli",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["multilingual_transformer*"]

[tool.setuptools.package-data]
multilingual_transformer = ["configs/*.toml"]
