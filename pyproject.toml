[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual_transformer"
version = "0.1.0"
description = "High-performance PyTorch multilingual transformer trained from scratch for Indic languages"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.3",
    "tokenizers",
    # Samanantar / Saamayik are script-based datasets; datasets>=4 dropped trust_remote_code.
    "datasets>=2.18,<4",
    "nltk",
    "numpy",
    "tqdm",
    "ipywidgets",
    "tomli; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["multilingual_transformer*"]

[tool.setuptools.package-data]
multilingual_transformer = ["configs/*.toml"]
