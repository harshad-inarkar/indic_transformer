[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indic_transformer"
version = "0.1.0"
description = "High-performance PyTorch multilingual transformer trained from scratch for Indic languages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "tokenizers>=0.19.0",
    "datasets>=2.18.0",
    "nltk>=3.8.1",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "ipywidgets>=8.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["indic_transformer*"]