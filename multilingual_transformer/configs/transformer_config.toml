[project]
name = "multilingual_transformer"
seed = 42



[language_map]
English   = "en"
Hindi     = "hi"
Marathi   = "mr"
Bengali   = "bn"
Gujarati  = "gu"
Kannada   = "kn"
Malayalam = "ml"
Odia      = "or"
Punjabi   = "pa"
Tamil     = "ta"
Telugu    = "te"
Assamese  = "as"
Sanskrit  = "sa"


# Only these three keys are needed. Language codes (tgt_lang) and lang_pair
# (e.g. "EN-HI") are derived from configs/language_config.toml.
[language]

#Hindi, Marathi, Bengali, Gujarati, Kannada, Malayalam, Odia, 
#Punjabi, Tamil, Telugu, Assamese, Sanskrit, English
src_lang = "English"
target_lang = "Hindi"


# Hindi          | cfilt/iitb-english-hindi 
# 11 Indic Lang  | ai4bharat/samanantar
# Sanskrit       | acomquest/Saamayik

dataset_name = "ai4bharat/samanantar"

[data]
data_dir = "processed_data"
checkpoint_dir = "checkpoints"
tokenizer_dir = "processed_tokenizers"
train_size = 50000
val_size = 5000    # per-epoch validation loss
test_size = 5000   # final BLEU/chrF and test samples
max_len = 80
max_length_ratio = 5.0
force_download = false

[tokenizer]

#bpe, unigram, wordpiece, whitespace, regex

algo_src = "wordpiece"
algo_tgt = "unigram"
max_vocab_size = 12800

[model]
d_model = 512
num_layers = 4
num_heads = 4
d_ff = 1024
dropout = 0.1

[training]
epochs = 10
batch_size = 512
lr = 5.0e-4
weight_decay = 0.01
label_smoothing = 0.1
torch_compile = false
gen_batch_size = 512
bleu_sample = 3000     # number of test sentences used for BLEU/chrF
save_best = true     # false: use latest checkpoint; true: use best-validation checkpoint

[inference]
sample_source = "config"   # "config" = sentences below, "test" = first num_samples test pairs
num_samples = 5            # used when sample_source = "test"
sample_sentences = [
    "farmer is important to the country",
    "education is essential for every child",
    "they are going to school",
    "She is smart girl",
    "he is a great teacher",
]

