[project]
name = "multilingual_transformer"
seed = 42

# Only these three keys are needed. Language codes (tgt_lang) and lang_pair
# (e.g. "EN-HI") are derived from configs/language_config.toml.
[language]

#Hindi, Marathi, Bengali, Gujarati, Kannada, Malayalam, Odia, 
#Punjabi, Tamil, Telugu, Assamese, Sanskrit, English
src_lang = "English"
target_lang = "Hindi"


# Hindi          | cfilt/iitb-english-hindi 
# 11 Indic Lang  | ai4bharat/samanantar
# Sanskrit       | acomquest/Saamayik

dataset_name = "ai4bharat/samanantar"

[data]
data_dir = "data"
checkpoint_dir = "checkpoints"
tokenizer_dir = "tokenizers"
train_size = 50000
val_size = 5000    # per-epoch validation loss
test_size = 5000   # final BLEU/chrF and test samples
max_len = 80
max_length_ratio = 6.0
force_download = false

[tokenizer]

#bpe, unigram, wordpiece, whitespace, regex

algo_src = "wordpiece"
algo_tgt = "unigram"
max_vocab_size = 22400

[model]
d_model = 512
num_layers = 6
num_heads = 8
d_ff = 2048
dropout = 0.1

[training]
epochs = 10
batch_size = 224
lr = 5.0e-4
weight_decay = 0.01
label_smoothing = 0.1
torch_compile = false
gen_batch_size = 128
bleu_sample = 300     # number of test sentences used for BLEU/chrF
save_best = false     # false: save latest checkpoint; true: save best-validation checkpoint

[inference]
sample_source = "test"   # "config" = sentences below, "test" = first num_samples test pairs
num_samples = 5            # used when sample_source = "test"
sample_sentences = [
    "this is a wonderful day",
    "education is essential for every child",
    "the water is very clean and cold",
    "how are you doing today ?",
    "farmers work hard in the field"
]
